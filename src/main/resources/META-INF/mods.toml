modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/Primogem-Studio/PrimogemCraftNeo/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "PrimogemCraft"
displayURL = "https://modrinth.com/mod/primogemcraft"
logoFile = "logo.png"
authors = "PepperMR, hackermdch"
credits = "Primogem Studio - https://github.com/Primogem-Studio"
description = '''一个原神x星穹铁道二创mod（1.20.1 Forge 移植版）'''

[[mixins]]
config = "primogemcraft.mixins.json"

# ===== 必需依赖 =====

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# ===== 可选依赖（联动模组）=====

[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "[15.0.0,16)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = false
versionRange = "[5.0.0,6)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "genshincraft"
mandatory = false
versionRange = "[1.4.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "farmersdelight"
mandatory = false
versionRange = "[1.20.1-1.3.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "teyvatdelight"
mandatory = false
versionRange = "[1.1.15,)"
ordering = "AFTER"
side = "BOTH"

# 已移除的可选依赖：
#   elixir —— Elixir Dan 无任何 1.20.1 版本，collab/elixir 桥接已删除
#   create / create-aeronautics / sable —— 原本仅为运行时开发依赖，
#     且 Aeronautics 与 Sable 无 1.20.1 版本；Create 保留为 localRuntime
